<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>My Live2D Stream</title>
    <script src="https://live2d.com"></script>
    <script src="https://cloudflare.com"></script>
    <script>
        window.Live2DCubismCore = window.Live2DCubismCore || {};
    </script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; background-color: transparent; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="live2d-canvas"></canvas>
    <script>
        window.addEventListener('load', async () => {
            const canvasElement = document.getElementById('live2d-canvas');
            
            if (!canvasElement) {
                console.error("Canvas element not found!");
                return;
            }

            if (typeof PIXI === 'undefined' || !PIXI.live2d) {
                console.error("PIXI library load failed.");
                return;
            }

            try {
                const app = new PIXI.Application({ 
                    view: canvasElement, 
                    transparent: true,
                    resizeTo: window,   
                    autoStart: true 
                });

                const modelPath = './models/apple.model3.json';
                const model = await PIXI.live2d.Live2DModel.from(modelPath);
                
                app.stage.addChild(model);
                
                model.scale.set(0.2); 
                model.anchor.set(0.5, 0.5);
                model.position.set(window.innerWidth / 2, window.innerHeight / 2);
                
                window.addEventListener('resize', () => {
                    model.position.set(window.innerWidth / 2, window.innerHeight / 2);
                });
            } catch (error) {
                console.error("Error loading Live2D model:", error);
            }
        });
    </script>
</body>
</html>
